<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Ticket | Cinematic Show</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand" aria-label="Cinematic Show home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>CINEMATIC SHOW</span>
      </a>
      <nav class="top-nav" aria-label="Main navigation">
        <a href="index.html" data-nav>Home</a>
        <a href="movies.html" data-nav>Movies</a>
        <a href="theatres.html" data-nav>Theatres</a>
        <a href="offers.html" data-nav>Offers</a>
        <a href="bookings.html" data-nav>My Bookings</a>
        <a href="help.html" data-nav>Help</a>
      </nav>
      <div class="header-actions">
        <label class="location-selector" aria-label="Select city">
          <span>📍</span>
          <select data-location-select aria-label="Choose location">
            <option value="Chennai">Chennai</option>
            <option value="Trichy">Trichy</option>
            <option value="Coimbatore">Coimbatore</option>
            <option value="Madurai">Madurai</option>
            <option value="Bangalore">Bangalore</option>
            <option value="Hyderabad">Hyderabad</option>
          </select>
        </label>
        <button class="icon-btn" aria-label="Search movies">🔍</button>
        <button class="icon-btn" aria-label="Open voice assistant" data-assistant-toggle>🎙️</button>
        <div class="profile-pill" aria-label="Profile">
          <span class="avatar">A</span>
          <span>Profile</span>
        </div>
        <button class="icon-btn menu-toggle hidden" aria-label="Open menu">☰</button>
      </div>
    </div>
  </header>

  <main class="main-shell">
    <div class="container">
      <div class="ticket-card" data-digital-ticket></div>
      <div class="action-row">
        <button class="btn btn-primary" type="button" onclick="window.print()">Download Ticket</button>
        <a class="btn btn-secondary" href="receipt.html">View Receipt</a>
        <a class="btn btn-secondary" href="bookings.html">My Bookings</a>
      </div>
    </div>
  </main>

  <div class="voice-assistant">
    <button class="assistant-fab pulsing" type="button" aria-label="CineBot assistant" data-assistant-toggle>🎙️</button>
    <div class="assistant-popup" data-assistant-popup>
      <div class="assistant-header">
        <div class="assistant-name">
          <span class="assistant-avatar">C</span>
          <span>CineBot</span>
        </div>
        <span class="listening-indicator"><span class="listening-ring"></span></span>
      </div>
      <div class="assistant-body" data-assistant-chat></div>
      <div class="assistant-input">
        <input type="text" placeholder="Ask CineBot..." data-assistant-input aria-label="Ask CineBot" />
        <button class="btn btn-primary" type="button" data-assistant-send>Send</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/search.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/booking.js"></script>
  <script>
    function renderDigitalTicket() {
      const state = bookingState.get();
      const movie = appUtils.getMovieById(state.movieId || state.movie?.id || 1);
      const bookingId = state.bookingId || 'CS2026000001';
      const seats = (state.seats || []).map((seat) => `${seat.row}${seat.number}`).join(', ') || 'N/A';
      const amount = state.pricing ? state.pricing.total : 0;
      const root = document.querySelector('[data-digital-ticket]');
      root.innerHTML = `
        <div class="ticket-header">
          <div>
            <h2>CINEMATIC SHOW</h2>
            <p class="text-muted">Digital Ticket</p>
          </div>
          <div class="badge status-ok">${state.paymentStatus || 'Paid'}</div>
        </div>
        <div class="ticket-body">
          <div>
            <div style="display:flex; gap:16px; align-items:center; margin-bottom:16px;">
              <div class="ticket-poster">
                ${posterImage(movie)}
              </div>
              <div>
                <h3>${movie.title}</h3>
                <p class="text-muted">${state.theatre || 'Cinematic PVR'} • Screen 04</p>
                <p class="text-muted">${state.date || 'Tomorrow'} • ${state.showtime || '07:30 PM'}</p>
              </div>
            </div>
            <div class="summary-list">
              <div class="summary-item"><span>Booking ID</span><strong>${bookingId}</strong></div>
              <div class="summary-item"><span>Seats</span><strong>${seats}</strong></div>
              <div class="summary-item"><span>Amount</span><strong>${appUtils.currency(amount)}</strong></div>
              <div class="summary-item"><span>Payment</span><strong>${state.paymentStatus || 'Paid'}</strong></div>
            </div>
          </div>
          <div class="qr-box">QR</div>
        </div>
      `;
    }
    renderDigitalTicket();
  </script>
</body>
</html>
