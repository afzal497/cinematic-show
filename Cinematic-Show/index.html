<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinematic Show</title>
  <meta name="description" content="Cinematic Show movie ticket booking platform" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand" aria-label="Cinematic Show home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>CINEMATIC SHOW</span>
      </a>
      <nav class="top-nav" aria-label="Main navigation">
        <a href="index.html" data-nav>Home</a>
        <a href="movies.html" data-nav>Movies</a>
        <a href="theatres.html" data-nav>Theatres</a>
        <a href="offers.html" data-nav>Offers</a>
        <a href="bookings.html" data-nav>My Bookings</a>
        <a href="help.html" data-nav>Help</a>
      </nav>
      <div class="header-actions">
        <label class="location-selector" aria-label="Select city">
          <span>📍</span>
          <select data-location-select aria-label="Choose location">
            <option value="Chennai">Chennai</option>
            <option value="Trichy">Trichy</option>
            <option value="Coimbatore">Coimbatore</option>
            <option value="Madurai">Madurai</option>
            <option value="Bangalore">Bangalore</option>
            <option value="Hyderabad">Hyderabad</option>
          </select>
        </label>
        <button class="icon-btn" aria-label="Search movies">🔍</button>
        <button class="icon-btn" aria-label="Open voice assistant" data-assistant-toggle>🎙️</button>
        <div class="profile-pill" aria-label="Profile">
          <span class="avatar">A</span>
          <span>Profile</span>
        </div>
        <button class="icon-btn menu-toggle hidden" aria-label="Open menu">☰</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-content">
        <div class="hero-copy">
          <span class="eyebrow">Now Showing</span>
          <h1>Your Movie Night Starts Here.</h1>
          <p class="hero-subtitle">Discover. Choose. Book. Experience.</p>
          <div class="search-panel">
            <div class="search-field">
              <span class="search-icon">🔎</span>
              <input type="text" placeholder="Search for movies, theatres or languages..." data-search-input aria-label="Search" />
            </div>
            <button class="voice-mic" type="button" aria-label="Voice search" data-assistant-toggle>🎤</button>
            <button class="btn btn-primary" type="button" data-search-button>Search</button>
            <div class="search-suggestions" data-search-suggestions aria-live="polite"></div>
          </div>
          <div class="pill-row" style="margin-top: 18px;">
            <span class="badge">Leo</span>
            <span class="badge">Interstellar</span>
            <span class="badge">Avatar</span>
            <span class="badge">Tamil movies</span>
            <span class="badge">IMAX</span>
          </div>
          <div class="hero-actions">
            <a class="btn btn-primary" href="movies.html">Explore Movies</a>
            <a class="btn btn-secondary" href="theatres.html?id=1">Book Tickets</a>
          </div>
        </div>
        <div class="hero-visual" aria-label="Featured movies">
          <div class="poster-stack">
            <div class="poster-card" style="background-image: url('assets/images/posters/dune-part-two.svg');"></div>
            <div class="poster-card" style="background-image: url('assets/images/posters/interstellar.svg');"></div>
            <div class="poster-card" style="background-image: url('assets/images/posters/leo.svg');"></div>
            <div class="poster-glow"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="main-shell">
      <div class="container">
        <div class="section-title-wrap" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px;">
          <h2 class="section-title">Recommended For You</h2>
        </div>
        <div class="movie-grid" data-recommendations></div>
      </div>
    </section>

    <section class="main-shell" style="padding-top: 0;">
      <div class="container">
        <h2 class="section-title">My Favorites</h2>
        <div class="movie-grid" data-favorites-list></div>
      </div>
    </section>
  </main>

  <div class="voice-assistant">
    <button class="assistant-fab pulsing" type="button" aria-label="CineBot assistant" data-assistant-toggle>🎙️</button>
    <div class="assistant-popup" data-assistant-popup>
      <div class="assistant-header">
        <div class="assistant-name">
          <span class="assistant-avatar">C</span>
          <span>CineBot</span>
        </div>
        <span class="listening-indicator"><span class="listening-ring"></span></span>
      </div>
      <div class="assistant-body" data-assistant-chat></div>
      <div class="assistant-input">
        <input type="text" placeholder="Ask CineBot..." data-assistant-input aria-label="Ask CineBot" />
        <button class="btn btn-primary" type="button" data-assistant-send>Send</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/search.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
