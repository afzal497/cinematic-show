<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Theatre | Cinematic Show</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand" aria-label="Cinematic Show home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>CINEMATIC SHOW</span>
      </a>
      <nav class="top-nav" aria-label="Main navigation">
        <a href="index.html" data-nav>Home</a>
        <a href="movies.html" data-nav>Movies</a>
        <a href="theatres.html" data-nav>Theatres</a>
        <a href="offers.html" data-nav>Offers</a>
        <a href="bookings.html" data-nav>My Bookings</a>
        <a href="help.html" data-nav>Help</a>
      </nav>
      <div class="header-actions">
        <label class="location-selector" aria-label="Select city">
          <span>📍</span>
          <select data-location-select aria-label="Choose location">
            <option value="Chennai">Chennai</option>
            <option value="Trichy">Trichy</option>
            <option value="Coimbatore">Coimbatore</option>
            <option value="Madurai">Madurai</option>
            <option value="Bangalore">Bangalore</option>
            <option value="Hyderabad">Hyderabad</option>
          </select>
        </label>
        <button class="icon-btn" aria-label="Search movies">🔍</button>
        <button class="icon-btn" aria-label="Open voice assistant" data-assistant-toggle>🎙️</button>
        <div class="profile-pill" aria-label="Profile">
          <span class="avatar">A</span>
          <span>Profile</span>
        </div>
        <button class="icon-btn menu-toggle hidden" aria-label="Open menu">☰</button>
      </div>
    </div>
  </header>

  <main class="main-shell">
    <div class="container selection-grid">
      <section>
        <h1 class="section-title">Select Theatre & Showtime</h1>
        <div class="theatre-list" data-theatre-list></div>
      </section>
      <aside class="summary-box panel" style="padding: 20px;">
        <h3>Booking Summary</h3>
        <div class="summary-list" data-selection-summary></div>
        <div style="margin-top: 16px;">
          <button class="btn btn-primary" type="button" data-select-showtime>Continue</button>
        </div>
      </aside>
    </div>
  </main>

  <div class="voice-assistant">
    <button class="assistant-fab pulsing" type="button" aria-label="CineBot assistant" data-assistant-toggle>🎙️</button>
    <div class="assistant-popup" data-assistant-popup>
      <div class="assistant-header">
        <div class="assistant-name">
          <span class="assistant-avatar">C</span>
          <span>CineBot</span>
        </div>
        <span class="listening-indicator"><span class="listening-ring"></span></span>
      </div>
      <div class="assistant-body" data-assistant-chat></div>
      <div class="assistant-input">
        <input type="text" placeholder="Ask CineBot..." data-assistant-input aria-label="Ask CineBot" />
        <button class="btn btn-primary" type="button" data-assistant-send>Send</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/search.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/booking.js"></script>
  <script>
    function renderTheatres() {
      const movie = getSelectedMovie();
      const theatreList = document.querySelector('[data-theatre-list]');
      const summary = document.querySelector('[data-selection-summary]');
      const theatres = getTheatreOptions(movie);
      theatreList.innerHTML = theatres.map((theatre, index) => `
        <article class="theatre-card ${index === 0 ? 'selected' : ''}" data-theatre-card="${theatre.name}">
          <div class="theatre-top">
            <div>
              <h3>${theatre.name}</h3>
              <p class="text-muted">${theatre.distance} away • ⭐ ${theatre.rating}</p>
            </div>
            <span class="badge">${theatre.amenities.split('•')[0].trim()}</span>
          </div>
          <p class="text-muted">${theatre.amenities}</p>
          <div class="showtimes">
            ${theatre.showtimes.map((time) => `<button class="showtime-chip ${time === '07:30 PM' ? 'active' : ''}" type="button" data-theatre-name="${theatre.name}" data-showtime="${time}">${time}</button>`).join('')}
          </div>
        </article>
      `).join('');

      const selectedMovie = movie || movieDatabase[0];
      summary.innerHTML = `
        <div class="summary-item"><span>Movie</span><strong>${selectedMovie.title}</strong></div>
        <div class="summary-item"><span>Format</span><strong>${selectedMovie.formats[0]}</strong></div>
        <div class="summary-item"><span>Date</span><strong>Tomorrow</strong></div>
      `;

      document.querySelectorAll('[data-theatre-card]').forEach((card) => {
        card.addEventListener('click', () => {
          document.querySelectorAll('[data-theatre-card]').forEach((item) => item.classList.remove('selected'));
          card.classList.add('selected');
          const theatreName = card.dataset.theatreCard;
          bookingState.set({ theatre: theatreName, format: selectedMovie.formats[0], date: 'Tomorrow' });
          summary.innerHTML = `
            <div class="summary-item"><span>Movie</span><strong>${selectedMovie.title}</strong></div>
            <div class="summary-item"><span>Theatre</span><strong>${theatreName}</strong></div>
            <div class="summary-item"><span>Format</span><strong>${selectedMovie.formats[0]}</strong></div>
            <div class="summary-item"><span>Date</span><strong>Tomorrow</strong></div>
          `;
        });
      });

      document.querySelectorAll('.showtime-chip').forEach((button) => {
        button.addEventListener('click', () => {
          document.querySelectorAll('.showtime-chip').forEach((chip) => chip.classList.remove('active'));
          button.classList.add('active');
          const theatre = button.dataset.theatreName;
          const time = button.dataset.showtime;
          bookingState.set({ theatre, showtime: time, date: 'Tomorrow', format: selectedMovie.formats[0] });
          summary.innerHTML = `
            <div class="summary-item"><span>Movie</span><strong>${selectedMovie.title}</strong></div>
            <div class="summary-item"><span>Theatre</span><strong>${theatre}</strong></div>
            <div class="summary-item"><span>Date</span><strong>Tomorrow</strong></div>
            <div class="summary-item"><span>Time</span><strong>${time}</strong></div>
            <div class="summary-item"><span>Format</span><strong>${selectedMovie.formats[0]}</strong></div>
          `;
        });
      });
    }

    document.querySelector('[data-select-showtime]')?.addEventListener('click', () => {
      const state = bookingState.get();
      if (!state.theatre || !state.showtime) {
        appUtils.showToast('Please select a theatre and showtime first.', 'warning');
        return;
      }
      window.location.href = 'seat-selection.html';
    });

    renderTheatres();
  </script>
</body>
</html>
